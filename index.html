
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Shooter - 100 Levels</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
}

body {
  min-height: 100vh;
  background: #080d20;
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

.game {
  width: 100%;
  max-width: 440px;
  background: linear-gradient(160deg,#18264b,#0b1230);
  border: 1px solid #334779;
  border-radius: 25px;
  padding: 17px;
  box-shadow: 0 20px 60px #0009;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.logo {
  font-size: 23px;
  font-weight: 900;
  color: #55eaff;
  text-shadow: 0 0 15px #00bfff;
}

.level {
  background: #273d72;
  padding: 9px 15px;
  border-radius: 20px;
  font-weight: bold;
}

.stats {
  display: flex;
  gap: 9px;
  margin-bottom: 13px;
}

.stat {
  flex: 1;
  text-align: center;
  background: #101b3a;
  border: 1px solid #314675;
  padding: 10px 4px;
  border-radius: 12px;
}

.stat small {
  color: #9cb3e9;
  display: block;
  font-size: 11px;
}

.stat strong {
  display: block;
  font-size: 20px;
  margin-top: 3px;
}

.progress {
  height: 9px;
  background: #0a1027;
  border-radius: 20px;
  margin-bottom: 13px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#00eaff,#a45cff);
  transition: width .3s;
}

canvas {
  width: 100%;
  display: block;
  background: radial-gradient(ellipse at top,#233e76,#101a3a 75%);
  border: 1px solid #39558a;
  border-radius: 16px;
  touch-action: none;
}

.controls {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
}

button {
  flex: 1;
  border: none;
  padding: 13px 8px;
  border-radius: 13px;
  color: white;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  background: linear-gradient(135deg,#287cff,#714dff);
  box-shadow: 0 5px 15px #315bff55;
}

button:active {
  transform: scale(.95);
}

#pause {
  background: linear-gradient(135deg,#ff9d38,#ff554d);
}

.hint {
  text-align: center;
  color: #9db6e9;
  font-size: 12px;
  margin-top: 13px;
}

.overlay {
  position: absolute;
  inset: 0;
  background: #070d20dd;
  display: none;
  justify-content: center;
  align-items: center;
  border-radius: 20px;
  z-index: 5;
}

.overlay.show {
  display: flex;
}

.popup {
  width: 85%;
  background: linear-gradient(145deg,#243e78,#111c42);
  border: 1px solid #648cff;
  border-radius: 22px;
  padding: 28px 18px;
  text-align: center;
}

.popup h1 {
  color: #55eaff;
  margin-bottom: 12px;
}

.popup p {
  color: #c4d4ff;
  margin-bottom: 20px;
}

.wrapper {
  width: 100%;
  position: relative;
}

</style>
</head>

<body>

<div class="game">

  <div class="header">
    <div class="logo">🔮 BUBBLE POP</div>
    <div class="level" id="level">LEVEL 0</div>
  </div>

  <div class="stats">
    <div class="stat">
      <small>SCORE</small>
      <strong id="score">0</strong>
    </div>
    <div class="stat">
      <small>TARGET</small>
      <strong id="target">300</strong>
    </div>
    <div class="stat">
      <small>BEST</small>
      <strong id="best">0</strong>
    </div>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="wrapper">
    <canvas id="canvas" width="420" height="700"></canvas>

    <div class="overlay" id="overlay">
      <div class="popup">
        <h1 id="popupTitle">LEVEL COMPLETE!</h1>
        <p id="popupText">Amazing! You completed the level.</p>
        <button id="popupBtn" onclick="nextLevel()">NEXT LEVEL ➜</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="restart()">↻ RESTART</button>
    <button id="pause" onclick="togglePause()">Ⅱ PAUSE</button>
  </div>

  <div class="hint">
    🎯 Aim and tap to shoot • Match 3 or more bubbles!
  </div>

</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const W = 420;
const H = 700;
const R = 16;
const STEP = 34;
const ROW = 29.5;
const COLS = 11;
const MAX_ROWS = 20;

const colors = [
  "#ff456a",
  "#39d9ff",
  "#ffd447",
  "#9c6bff",
  "#40ed9c"
];

let grid = [];
let level = 0;
let score = 0;
let best = Number(localStorage.getItem("bubbleBest")) || 0;
let target = 300;
let currentColor = 0;
let nextColor = 1;
let projectile = null;
let aim = {x:210,y:200};
let paused = false;
let gameOver = false;
let levelWon = false;
let particles = [];
let shots = 0;

const shooter = {x:210,y:650};

function randomColor() {
  return Math.floor(Math.random() * Math.min(5,3 + Math.floor(level/15)));
}

function xPos(r,c) {
  return 28 + c*STEP + (r%2)*17;
}

function yPos(r) {
  return 55 + r*ROW;
}

function valid(r,c) {
  return r>=0 && r<MAX_ROWS && c>=0 && c<COLS;
}

function neighbors(r,c) {
  const shift = r%2;
  return [
    [r,c-1],[r,c+1],
    [r-1,c-shift],[r-1,c+1-shift],
    [r+1,c-shift],[r+1,c+1-shift]
  ].filter(([a,b])=>valid(a,b));
}

function initGrid() {
  grid = [];

  let rows = Math.min(5 + Math.floor(level/10),12);

  for(let r=0;r<MAX_ROWS;r++) {
    grid[r] = [];

    for(let c=0;c<COLS;c++) {
      if(r<rows && Math.random() > .13) {
        grid[r][c] = randomColor();
      } else {
        grid[r][c] = null;
      }
    }
  }
}

function newGame() {
  score = 0;
  shots = 0;
  gameOver = false;
  levelWon = false;
  paused = false;
  projectile = null;
  particles = [];

  target = 300 + level*100;

  initGrid();

  currentColor = randomColor();
  nextColor = randomColor();

  document.getElementById("overlay").classList.remove("show");
  document.getElementById("pause").innerText = "Ⅱ PAUSE";

  updateUI();
}

function restart() {
  newGame();
}

function updateUI() {
  document.getElementById("level").innerText = "LEVEL " + level;
  document.getElementById("score").innerText = score;
  document.getElementById("target").innerText = target;
  document.getElementById("best").innerText = best;

  document.getElementById("progress").style.width =
    Math.min(100,score/target*100) + "%";
}

function drawBubble(x,y,color,r=R) {
  if(color === null || color === undefined) return;

  let g = ctx.createRadialGradient(
    x-r*.4,y-r*.5,2,
    x,y,r
  );

  g.addColorStop(0,"#ffffff");
  g.addColorStop(.18,colors[color]);
  g.addColorStop(1,"#14204c");

  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();

  ctx.strokeStyle = "#ffffff66";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(x-r*.35,y-r*.4,3,0,Math.PI*2);
  ctx.fillStyle = "#ffffffaa";
  ctx.fill();
}

function drawBackground() {
  ctx.clearRect(0,0,W,H);

  for(let i=0;i<35;i++) {
    let x=(i*97)%W;
    let y=(i*137)%H;

    ctx.fillStyle="#ffffff22";
    ctx.fillRect(x,y,2,2);
  }
}

function drawGrid() {
  for(let r=0;r<MAX_ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c] !== null) {
        drawBubble(xPos(r,c),yPos(r),grid[r][c]);
      }
    }
  }
}

function drawShooter() {
  ctx.beginPath();
  ctx.arc(shooter.x,shooter.y,25,0,Math.PI*2);
  ctx.fillStyle="#243e75";
  ctx.fill();

  ctx.strokeStyle="#7bcfff";
  ctx.lineWidth=2;
  ctx.stroke();

  drawBubble(shooter.x,shooter.y,currentColor,14);

  drawBubble(350,650,nextColor,12);

  ctx.fillStyle="#a9c9ff";
  ctx.font="12px Arial";
  ctx.fillText("NEXT",334,680);
}

function drawAim() {
  if(projectile || paused || gameOver || levelWon) return;

  let dx=aim.x-shooter.x;
  let dy=aim.y-shooter.y;

  let angle=Math.atan2(dy,dx);

  if(angle > -0.15) angle=-0.15;
  if(angle < -Math.PI+0.15) angle=-Math.PI+0.15;

  ctx.setLineDash([5,8]);
  ctx.strokeStyle="#ffffff99";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(shooter.x,shooter.y);
  ctx.lineTo(
    shooter.x+Math.cos(angle)*115,
    shooter.y+Math.sin(angle)*115
  );
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawParticles() {
  particles.forEach(p=>{
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

function render() {
  drawBackground();
  drawGrid();
  drawAim();
  drawShooter();

  if(projectile) {
    drawBubble(projectile.x,projectile.y,projectile.color);
  }

  drawParticles();

  if(paused) {
    ctx.fillStyle="#0009";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="white";
    ctx.font="bold 34px Arial";
    ctx.textAlign="center";
    ctx.fillText("PAUSED",W/2,H/2);
    ctx.textAlign="left";
  }
}

function getAngle() {
  let a=Math.atan2(
    aim.y-shooter.y,
    aim.x-shooter.x
  );

  return Math.max(
    -Math.PI+.15,
    Math.min(-.15,a)
  );
}

function shoot() {
  if(projectile || paused || gameOver || levelWon) return;

  let a=getAngle();

  projectile={
    x:shooter.x,
    y:shooter.y,
    vx:Math.cos(a)*9,
    vy:Math.sin(a)*9,
    color:currentColor
  };
}

function findNearest(x,y) {
  let bestCell=null;
  let distance=Infinity;

  for(let r=0;r<MAX_ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c] !== null) continue;

      let xx=xPos(r,c);
      let yy=yPos(r);
      let d=Math.hypot(xx-x,yy-y);

      if(d<distance) {
        distance=d;
        bestCell={r,c};
      }
    }
  }

  return bestCell;
}

function updateProjectile() {
  if(!projectile) return;

  projectile.x+=projectile.vx;
  projectile.y+=projectile.vy;

  if(projectile.x<R || projectile.x>W-R) {
    projectile.vx*=-1;
  }

  let hit = projectile.y<R;

  for(let r=0;r<MAX_ROWS && !hit;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c]===null) continue;

      if(Math.hypot(
        projectile.x-xPos(r,c),
        projectile.y-yPos(r)
      )<R*2-2) {
        hit=true;
        break;
      }
    }
  }

  if(hit) {
    placeProjectile();
  }
}

function placeProjectile() {
  if(!projectile) return;

  let cell=findNearest(projectile.x,projectile.y);

  if(!cell) {
    projectile=null;
    return;
  }

  let {r,c}=cell;
  let color=projectile.color;

  grid[r][c]=color;
  projectile=null;

  shots++;

  let group=findMatches(r,c,color);

  if(group.length>=3) {
    group.forEach(([a,b])=>{
      createParticles(xPos(a,b),yPos(a),color);
      grid[a][b]=null;
    });

    score+=group.length*20;

    removeFloating();

  } else if(shots%6===0) {
    addPenaltyRow();
  }

  currentColor=nextColor;
  nextColor=randomColor();

  updateUI();
  checkGame();
}

function findMatches(r,c,color) {
  let stack=[[r,c]];
  let visited=new Set();
  let result=[];

  while(stack.length) {
    let [a,b]=stack.pop();
    let key=a+","+b;

    if(visited.has(key)) continue;
    visited.add(key);

    if(!valid(a,b) || grid[a][b]!==color) continue;

    result.push([a,b]);

    neighbors(a,b).forEach(n=>stack.push(n));
  }

  return result;
}

function removeFloating() {
  let connected=new Set();
  let stack=[];

  for(let c=0;c<COLS;c++) {
    if(grid[0][c]!==null) stack.push([0,c]);
  }

  while(stack.length) {
    let [r,c]=stack.pop();
    let key=r+","+c;

    if(connected.has(key)) continue;
    connected.add(key);

    neighbors(r,c).forEach(([a,b])=>{
      if(grid[a][b]!==null) stack.push([a,b]);
    });
  }

  for(let r=0;r<MAX_ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c]!==null &&
         !connected.has(r+","+c)) {
        createParticles(xPos(r,c),yPos(r),grid[r][c]);
        grid[r][c]=null;
        score+=10;
      }
    }
  }
}

function addPenaltyRow() {
  for(let r=MAX_ROWS-1;r>0;r--) {
    grid[r]=grid[r-1].slice();
  }

  grid[0]=[];

  for(let c=0;c<COLS;c++) {
    grid[0][c]=randomColor();
  }
}

function createParticles(x,y,color) {
  for(let i=0;i<7;i++) {
    particles.push({
      x,y,
      vx:(Math.random()-.5)*5,
      vy:(Math.random()-.5)*5,
      color:colors[color],
      life:1
    });
  }
}

function updateParticles() {
  particles.forEach(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    p.life-=.035;
  });

  particles=particles.filter(p=>p.life>0);
}

function checkGame() {
  updateUI();

  if(score>=target) {
    winLevel();
    return;
  }

  let count=0;
  let highest=0;

  for(let r=0;r<MAX_ROWS;r++) {
    for(let c=0;c<COLS;c++) {
      if(grid[r][c]!==null) {
        count++;
        highest=Math.max(highest,r);
      }
    }
  }

  if(count===0) {
    winLevel();
    return;
  }

  if(highest>=MAX_ROWS-2 || yPos(highest)>610) {
    endGame();
  }
}

function winLevel() {
  if(levelWon) return;

  levelWon=true;
  let completed=level;

  document.getElementById("popupTitle").innerText=
    completed>=100 ? "🏆 YOU ARE THE CHAMPION!" : "🎉 LEVEL COMPLETE!";

  document.getElementById("popupText").innerText=
    completed>=100
    ? "You completed all 100 levels!"
    : "Amazing! Get ready for level "+(level+1);

  document.getElementById("popupBtn").innerText=
    completed>=100 ? "PLAY AGAIN" : "NEXT LEVEL ➜";

  document.getElementById("overlay").classList.add("show");
}

function endGame() {
  gameOver=true;

  document.getElementById("popupTitle").innerText=
    "GAME OVER!";

  document.getElementById("popupText").innerText=
    "Your score: "+score+" • Try again!";

  document.getElementById("popupBtn").innerText=
    "RETRY";

  document.getElementById("overlay").classList.add("show");
}

function nextLevel() {
  if(levelWon) {
    if(level>=100) level=0;
    else level++;
  }

  newGame();
}

function togglePause() {
  if(gameOver || levelWon) return;

  paused=!paused;

  document.getElementById("pause").innerText=
    paused ? "▶ RESUME" : "Ⅱ PAUSE";
}

function loop() {
  if(!paused && !gameOver && !levelWon) {
    updateProjectile();
    updateParticles();
  }

  render();
  requestAnimationFrame(loop);
}

function pointerMove(e) {
  const rect=canvas.getBoundingClientRect();

  aim.x=(e.clientX-rect.left)*W/rect.width;
  aim.y=(e.clientY-rect.top)*H/rect.height;

  aim.y=Math.min(aim.y,shooter.y-20);
}

canvas.addEventListener("pointermove",pointerMove);

canvas.addEventListener("pointerdown",e=>{
  pointerMove(e);
  shoot();
});

newGame();
loop();
</script>

</body>
</html>
